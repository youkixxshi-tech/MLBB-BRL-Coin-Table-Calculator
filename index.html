<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justin Kyle - MLBB BRL Coin Table Calculator</title>
  <style>
    :root {
      --primary: #1d63ed;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
    }
    body.theme-blue { --primary: #1d63ed; }
    body.theme-sakura { --primary: #db2777; }
    body.theme-mint { --primary: #059669; }
    body.theme-peach { --primary: #f43f5e; }

    body {
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    .banner {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      font-size: 17px;
    }
    .contact-bar {
      background: var(--card);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
      font-size: 14px;
    }
    .contact-bar a {
      color: var(--primary);
      font-weight: bold;
      text-decoration: none;
    }
    .themes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .themes button {
      flex: 1;
      min-width: 80px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-blue { background: #1d63ed; }
    .btn-sakura { background: #db2777; }
    .btn-mint { background: #059669; }
    .btn-peach { background: #f43f5e; }

    .box {
      background: var(--card);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
    }
    .table-wrap {
      overflow-x: auto;
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px 6px;
      text-align: center;
    }
    th {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body class="theme-blue">

    <div class="themes">

      <button class="btn-sakura" onclick="setTheme('theme-sakura')">Sakura</button>
      <button class="btn-mint" onclick="setTheme('theme-mint')">Mint</button>
      <button class="btn-peach" onclick="setTheme('theme-peach')">Peach</button>

    <div class="table-wrap">

            <th>Total MMK</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
